<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Most Used Guides | BD Tools</title>

  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/page-loader.css" />

  <script>
    document.documentElement.classList.add("page-loading");
    document.documentElement.setAttribute("aria-busy", "true");
  </script>
</head>

<body data-view="most-used" data-waits-for-user="true">
  <div class="page-loader" id="pageLoader" role="status" aria-live="polite" aria-label="Loading page">
    <div class="page-loader-inner">
      <div class="page-loader-mark" aria-hidden="true">
        <span class="page-loader-ring"></span>
        <span class="page-loader-dot"></span>
      </div>
      <p class="page-loader-text">Loading BD Tools…</p>
    </div>
  </div>

  <div class="app-shell">
    <div id="header-placeholder"></div>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <h1>Most Used <span>Guides</span></h1>
          <p>Your most frequently opened guides.<br class="desktop-only" /> Quick access to the ones you use most.</p>

          <div class="hero-search">
            <span class="search-icon"></span>
            <input id="guideSearch" type="search" autocomplete="off" placeholder="Search guides..." />
            <button id="searchButton" type="button">Search</button>
          </div>
        </div>

        <div class="hero-art" aria-hidden="true"></div>

        <section class="stats-row" aria-label="Views" style="grid-template-columns: repeat(3, 1fr);">
          <button class="stat-card" type="button" data-view="most-used">
            <div class="stat-icon purple">
              <svg class="ui-icon stat-svg" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 16l5-5 3.5 3.5L20 7"/>
                <path d="M15 7h5v5"/>
              </svg>
            </div>
            <div><strong id="count-most">0</strong><small>Most Used</small></div>
          </button>

          <button class="stat-card" type="button" data-view="recent">
            <div class="stat-icon blue">
              <svg class="ui-icon stat-svg" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="8.5"/>
                <path d="M12 7.5v5l3.3 2"/>
              </svg>
            </div>
            <div><strong id="count-recent">0</strong><small>Recent Activity</small></div>
          </button>

          <button class="stat-card" type="button" data-view="favorites">
            <div class="stat-icon yellow">
              <svg class="ui-icon stat-svg star-svg" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m12 3.8 2.55 5.18 5.72.83-4.14 4.04.98 5.7L12 16.86 6.89 19.55l.98-5.7-4.14-4.04 5.72-.83L12 3.8Z"/>
              </svg>
            </div>
            <div><strong id="count-fav">0</strong><small>Favorites</small></div>
          </button>
        </section>
      </section>

      <section class="section my-guides-section">
        <div class="section-heading">
          <h2><span class="heading-bar"></span><span id="libraryTitle">Most Used Guides</span></h2>
          <a href="index.html" class="view-all my-guides-back">← Back to Dashboard</a>
        </div>

        <p id="resultsText" class="library-results">Showing 0 guides</p>

        <div id="myGuidesList" class="my-guides-grid"></div>

        <div id="noResults" class="no-results" hidden>
          <div class="no-results-icon">⌕</div>
          <h3>Nothing to show yet</h3>
          <p id="noResultsCopy">Open a guide to start tracking.</p>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
  </div>

  <script src="shared/include.js"></script>
  <script src="assets/js/my-guides.js"></script>
  <script src="assets/js/page-loader.js"></script>

  <script>
    window.bdToolsUserReady = function () {
      window.dispatchEvent(new Event("bdtools:user-ready"));
    };
  </script>
</body>
</html>
