<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Decision Support System — Sign In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <div class="login-page">

    <!-- V2 Header -->
    <header class="login-header">
      <div class="login-brand">
        <img src="fedex-logo.png" alt="FedEx Freight">
        <span class="brand-divider"></span>
        <span class="brand-title">Decision Support System</span>
      </div>
    </header>

    <!-- Login area -->
    <main class="login-main">

      <div class="login-background"></div>

      <section class="login-card" aria-labelledby="loginTitle">

        <div class="login-card-top">
          <div class="welcome-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 3.5a7.2 7.2 0 0 0-7.2 7.2v3.1a2.2 2.2 0 0 0 2.2 2.2h1.2v-5.8H6.9a5.1 5.1 0 0 1 10.2 0h-1.3V16h1.3v.1a2 2 0 0 1-2 2H13"/>
              <path d="M9.4 19.3h3.8"/>
            </svg>
          </div>

          <div>
            <div class="eyebrow">FEDEx Freight</div>
            <h1 id="loginTitle">Welcome back</h1>
            <p class="login-subtitle">
              Sign in to access the Decision Support System.
            </p>
          </div>
        </div>

        <div class="field">
          <div class="label-row">
            <label for="email">Username</label>
            <span>Company email only</span>
          </div>

          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="5.5" width="17" height="13" rx="2"></rect>
              <path d="m4.5 7 7.5 5.4L19.5 7"></path>
            </svg>

            <input
              id="email"
              type="email"
              placeholder="name@fedexfreight.com"
              autocomplete="email"
            >
          </div>
        </div>

        <div class="field">
          <div class="label-row">
            <label for="password">Password</label>
            <span>Required to continue</span>
          </div>

          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="10" width="14" height="10" rx="2"></rect>
              <path d="M8 10V7.7a4 4 0 0 1 8 0V10"></path>
            </svg>

            <input
              id="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
            >

            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
              aria-label="Show password"
            >
              <svg id="togglePasswordIcon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3.5 12s3.2-5 8.5-5 8.5 5 8.5 5-3.2 5-8.5 5-8.5-5-8.5-5Z"></path>
                <circle cx="12" cy="12" r="2.2"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button class="primary-btn" id="loginBtn" type="button">
          Sign In
          <span class="button-arrow">→</span>
        </button>

        <div class="forgot-row">
          <button class="forgot-link" id="resetBtn" type="button">
            Forgot password?
          </button>
        </div>

        <div id="message" class="message"></div>

        <div class="login-note">
          <span class="note-dot"></span>
          Only verified and approved users can access the system.
        </div>

      </section>

    </main>

    <footer class="login-footer">
      <span>FedEx Freight Decision Support System</span>
      <span>Guiding every decision. Delivering every time.</span>
    </footer>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="login.js"></script>

</body>
</html>
