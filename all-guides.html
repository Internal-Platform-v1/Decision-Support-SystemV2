<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BD Tools — All Guides</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/guide-themes.css" />
  <link rel="stylesheet" href="assets/css/all-guides.css" />
  <link rel="stylesheet" href="assets/css/page-loader.css" />

  <script>
    document.documentElement.classList.add("page-loading");
    document.documentElement.setAttribute("aria-busy", "true");
  </script>
</head>

<body data-waits-for-user="true">
  <div class="page-loader" id="pageLoader" role="status" aria-live="polite" aria-label="Loading page">
    <div class="page-loader-inner">
      <div class="page-loader-mark" aria-hidden="true">
        <span class="page-loader-ring"></span>
        <span class="page-loader-dot"></span>
      </div>
      <p class="page-loader-text">Loading BD Tools…</p>
    </div>
  </div>

  <div class="app-shell">
    <div id="header-placeholder"></div>

    <main>
      <section class="hero all-guides-hero">
        <div class="hero-copy">
          <h1>All <span>Guides</span></h1>
          <p>
            Your complete Decision Support System library.<br class="desktop-only" />
            Search, filter, and open the guide you need.
          </p>

          <div class="hero-search">
            <span class="search-icon"></span>
            <input
              id="guideSearch"
              type="search"
              autocomplete="off"
              placeholder="Search for guides, tools, topics..."
              aria-label="Search all guides"
            />
            <button id="searchButton" type="button">Search</button>
          </div>
        </div>

        <div class="hero-art" aria-hidden="true"></div>

        <section class="stats-row guide-filter-row" aria-label="Guide categories">
          <button class="stat-card guide-filter active purple-filter" type="button" data-group="all">
            <div class="stat-icon purple">
              <svg class="ui-icon stat-svg" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="5" width="6" height="6" rx="1.2"/>
                <rect x="14" y="5" width="6" height="6" rx="1.2"/>
                <rect x="4" y="13" width="6" height="6" rx="1.2"/>
                <rect x="14" y="13" width="6" height="6" rx="1.2"/>
              </svg>
            </div>
            <div class="filter-copy"><strong id="count-all">0</strong><small>All Guides</small></div>
          </button>

          <button class="stat-card guide-filter purple-filter" type="button" data-group="billing">
            <div class="stat-icon purple">
              <svg class="ui-icon stat-svg" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 3.8h8l4 4v12.4H6z"/>
                <path d="M14 3.8v4h4M9 12h6M9 15h4"/>
              </svg>
            </div>
            <div class="filter-copy"><strong id="count-billing">0</strong><small>Billing Dispute</small></div>
          </button>

          <button class="stat-card guide-filter orange-filter" type="button" data-group="pricing">
            <div class="stat-icon orange">
              <svg class="ui-icon stat-svg" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 6h14M5 10h14M7 14h10M9 18h6"/>
                <circle cx="18" cy="18" r="2.2"/>
              </svg>
            </div>
            <div class="filter-copy"><strong id="count-pricing">0</strong><small>Pricing General</small></div>
          </button>

          <button class="stat-card guide-filter blue-filter" type="button" data-group="surcharge">
            <div class="stat-icon blue">
              <svg class="ui-icon stat-svg" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 4h12v16H6z"/>
                <path d="M9 8h6M9 12h6M9 16h4"/>
              </svg>
            </div>
            <div class="filter-copy"><strong id="count-surcharge">0</strong><small>Surcharges</small></div>
          </button>

          <button class="stat-card guide-filter green-filter" type="button" data-group="account">
            <div class="stat-icon green">
              <svg class="ui-icon stat-svg" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="10" cy="8" r="3"/>
                <path d="M4.8 19v-1.2a4.5 4.5 0 0 1 4.5-4.5h1.4a4.5 4.5 0 0 1 4.5 4.5V19"/>
                <path d="M16 9h4M18 7v4"/>
              </svg>
            </div>
            <div class="filter-copy"><strong id="count-account">0</strong><small>Account Handling</small></div>
          </button>

          <button class="stat-card guide-filter indigo-filter" type="button" data-group="paud">
            <div class="stat-icon indigo">
              <svg class="ui-icon stat-svg" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="5" width="16" height="4" rx="1"/>
                <rect x="4" y="10" width="16" height="4" rx="1"/>
                <path d="M4 15h10v4H4zM17 16l2 2 3-4"/>
              </svg>
            </div>
            <div class="filter-copy"><strong id="count-paud">0</strong><small>PAUD Queue</small></div>
          </button>

          <button class="stat-card guide-filter pink-filter" type="button" data-group="other">
            <div class="stat-icon pink">
              <svg class="ui-icon stat-svg" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 3.8h8l4 4v12.4H6z"/>
                <path d="M14 3.8v4h4M9 12h6M9 15h4"/>
                <circle cx="17" cy="17" r="2"/>
              </svg>
            </div>
            <div class="filter-copy"><strong id="count-other">0</strong><small>Other Operational</small></div>
          </button>
        </section>
      </section>

      <section class="section library-section" id="guideLibrary">
        <div class="library-heading">
          <div class="library-heading-copy">
            <h2>
              <span class="heading-bar"></span>
              <span id="libraryTitle">All Guides</span>
            </h2>
            <p id="resultsText">Showing all guides</p>
          </div>

          <div class="library-actions">
            <div id="activeFilterPill" class="active-filter-pill" hidden>
              <span>Filtered by</span>
              <strong id="activeFilterName">All Guides</strong>
              <button id="clearFilter" type="button" aria-label="Clear category filter">×</button>
            </div>

            <button id="clearSearch" class="soft-action" type="button" hidden>Clear Search</button>
            <button id="sortButton" class="soft-action" type="button">Sort A–Z <span>↕</span></button>
          </div>
        </div>

        <div id="guideGrid" class="guide-grid" aria-live="polite"></div>

        <div id="noResults" class="no-results" hidden>
          <div class="no-results-icon">⌕</div>
          <h3>No guides found</h3>
          <p>Try another guide name, topic, or keyword.</p>
          <button id="resetSearch" type="button">Show All Guides</button>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Firebase SDK -->

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<!-- Shared header/footer and profile -->
<script src="shared/include.js"></script>

<!-- Page scripts -->
<script src="assets/js/all-guides.js"></script>
<script src="assets/js/page-loader.js"></script>

<script>
  window.bdToolsUserReady = function () {
    window.dispatchEvent(new Event("bdtools:user-ready"));
  };
</script>
</body>
</html>
