<!-- admin-header.html -->
<div class="admin-shell" id="adminShell">

  <!-- LEFT SIDEBAR -->
  <aside class="admin-sidebar" aria-label="Admin navigation">
    <div class="admin-profile-summary">
      <div class="admin-avatar" id="sidebarAvatar">AD</div>
      <div class="admin-profile-text">
        <div class="admin-profile-name" id="sidebarUserName">Admin User</div>
        <div class="admin-profile-role" id="sidebarUserRole">System Administrator</div>
        <div class="admin-profile-status">
          <span class="admin-status-dot"></span>
          <span>Online</span>
        </div>
      </div>
    </div>

    <nav class="admin-side-nav">
      <button class="admin-nav-item active" data-admin-page="dashboard" type="button">
        <span class="admin-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8v9.2a1 1 0 0 1-1 1h-5.2v-6h-5.6v6H4a1 1 0 0 1-1-1v-9.2Z"/></svg></span>
        <span>Dashboard</span>
      </button>

      <!-- ✅ NEW: USER MANAGEMENT -->
      <button class="admin-nav-item" data-admin-page="users" type="button">
        <span class="admin-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M17 20h5v-2a4 4 0 0 0-3-3.87"/><path d="M9 20H4v-2a4 4 0 0 1 3-3.87"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><circle cx="17" cy="7" r="4"/></svg></span>
        <span>User Management</span>
      </button>

      <button class="admin-nav-item" data-admin-page="feedback" type="button">
        <span class="admin-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/><path d="M9.9 8.8a2.3 2.3 0 1 1 3.4 2.1c-.7.4-1.3 1-1.3 1.8v.3"/><path d="M12 16.2v.01"/></svg></span>
        <span>Feedback &amp; GetHelp</span>
      </button>

      <button class="admin-nav-item" data-admin-page="templates" type="button">
        <span class="admin-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 3.5h10l4 4V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"/><path d="M15 3.5V8h4M8 12h8M8 15h8M8 18h5"/></svg></span>
        <span>Templates Management</span>
      </button>
      <button class="admin-nav-item" data-admin-page="announcements" type="button">
        <span class="admin-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 14V10a2 2 0 0 1 2-2h7l5-3v14l-5-3H6a2 2 0 0 1-2-2Z"/><path d="m8 16 1.5 4h3L11 16"/></svg></span>
        <span>Announcements</span>
      </button>
      <button class="admin-nav-item" data-admin-page="guides" type="button">
        <span class="admin-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21V5.5Z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5A2.5 2.5 0 0 1 20 21V5.5Z"/></svg></span>
        <span>Guide Management</span>
      </button>
      <button class="admin-nav-item" data-admin-page="logs" type="button">
        <span class="admin-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 5v5h5"/><path d="M12 7v5l3 2"/></svg></span>
        <span>System Logs</span>
      </button>
      <button class="admin-nav-item" data-admin-page="reports" type="button">
        <span class="admin-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20V12M10 20V7M16 20V4M22 20H2"/></svg></span>
        <span>Reports & Analytics</span>
      </button>
      <button class="admin-nav-item" data-admin-page="roles" type="button">
        <span class="admin-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 20 6v5c0 5-3.3 8.2-8 10-4.7-1.8-8-5-8-10V6l8-3Z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg></span>
        <span>Roles & Permissions</span>
      </button>
      <button class="admin-nav-item" data-admin-page="settings" type="button">
        <span class="admin-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9.2 3.8.6-1.3h4.4l.6 1.3 1.5.9 1.4-.2 2.2 3.8-1 1.1v1.8l1 1.1-2.2 3.8-1.4-.2-1.5.9-.6 1.3H9.8l-.6-1.3-1.5-.9-1.4.2-2.2-3.8 1-1.1V9.2l-1-1.1 2.2-3.8 1.4.2 1.5-.9Z"/><circle cx="12" cy="10.1" r="2.8"/></svg></span>
        <span>System Settings</span>
      </button>
    </nav>

    <div class="admin-sidebar-bottom">
      <div class="admin-help-card">
        <div class="admin-help-icon"><svg viewBox="0 0 24 24"><path d="M4 13v-2a8 8 0 0 1 16 0v2"/><path d="M4 13h3v6H5a1 1 0 0 1-1-1v-5ZM20 13h-3v6h2a1 1 0 0 0 1-1v-5Z"/><path d="M17 19c0 1.1-.9 2-2 2h-2"/></svg></div>
        <div class="admin-help-copy"><strong>Need Help?</strong><span>Contact Support</span></div>
        <button type="button" class="admin-help-button" data-admin-action="help">Get Help <span>→</span></button>
      </div>
      <div class="admin-sidebar-footer">
        <span class="admin-info-icon">i</span>
        <div><div>Version 1.0.0</div><div>© 2025 FedEx Freight</div></div>
      </div>
    </div>
  </aside>

  <!-- RIGHT SIDE -->
  <div class="admin-main">

    <header class="admin-top-header">
      <div class="admin-brand">
        <div class="admin-console-title">
          <strong id="adminPageTitle">Decision Support System</strong>
          <span>ADMIN CONSOLE</span>
        </div>
      </div>

      <div class="admin-top-actions">
        <div class="admin-header-datetime">
          <span>Today is</span>
          <strong id="adminCurrentDate">Tue, Sep 23, 2025</strong>
          <span class="admin-time-separator">|</span>
          <strong id="adminCurrentTime">1:34 AM (PHT)</strong>
        </div>

        <button class="admin-icon-button admin-notification-button" type="button" aria-label="Notifications" data-admin-action="notifications">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
          <span class="admin-notification-badge" id="adminNotificationBadge">3</span>
        </button>

        <span class="admin-top-divider"></span>

        <div class="admin-settings-wrapper">
          <button class="admin-user-menu" id="adminSettingsBtn" type="button" aria-expanded="false">
            <span class="admin-top-avatar" id="topUserAvatar">AD</span>
            <svg class="admin-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5"/></svg>
          </button>

<div class="admin-settings-dropdown" id="adminSettingsDropdown" hidden>

  <!-- Signed-in user identity -->
  <div class="admin-settings-user" id="adminSettingsUserBlock">
    <div class="admin-settings-user-avatar" id="adminSettingsUserAvatar">--</div>
    <div class="admin-settings-user-meta">
      <strong id="adminSettingsUserName">Admin User</strong>
      <small id="adminSettingsUserEmpId">System Administrator</small>
    </div>
  </div>

  <div class="admin-settings-heading">Settings</div>

  <div class="admin-settings-group">
    <span class="admin-settings-label">Theme</span>
    <div class="admin-theme-row">
      <button type="button" class="admin-theme-btn" data-theme-choice="light">☀ Light</button>
      <button type="button" class="admin-theme-btn" data-theme-choice="dark">☾ Dark</button>
    </div>
  </div>

  <div class="admin-settings-divider"></div>

  <button type="button" class="admin-settings-link" id="adminReturnHomeBtn">
    <span aria-hidden="true">🏠</span>
    Return to Home
  </button>

  <button type="button" class="admin-settings-link danger" data-admin-action="logout">
    <span aria-hidden="true">↩</span>
    Sign Out
  </button>

</div>

      </div>
    </header>

  </div>
</div>
