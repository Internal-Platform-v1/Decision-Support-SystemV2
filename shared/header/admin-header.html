<!-- admin-header.html -->
<div class="admin-top-nav-shell">
  <header class="admin-topbar">
    <!-- Brand -->
    <div class="admin-topbar-brand">
      <a href="../admin-dashboard/admin-dashboard.html" class="admin-brand-link">
        <span class="admin-brand-icon">🛡️</span>
        <span class="admin-brand-text">Decision Support System</span>
        <small>ADMIN CONSOLE</small>
      </a>
    </div>

    <!-- Navigation Links -->
    <nav class="admin-topbar-nav" aria-label="Admin navigation">
      <button class="admin-nav-item" data-admin-page="dashboard" type="button">Dashboard</button>
      <button class="admin-nav-item" data-admin-page="users" type="button">Users</button>
      <button class="admin-nav-item" data-admin-page="templates" type="button">Templates</button>
      <button class="admin-nav-item" data-admin-page="guides" type="button">Guides</button>
      <button class="admin-nav-item" data-admin-page="announcements" type="button">Announcements</button>
      <button class="admin-nav-item" data-admin-page="logs" type="button">Logs</button>
      <button class="admin-nav-item" data-admin-page="reports" type="button">Reports</button>
      <button class="admin-nav-item" data-admin-page="roles" type="button">Roles</button>
      <button class="admin-nav-item" data-admin-page="settings" type="button">Settings</button>
    </nav>

    <!-- Right Actions -->
    <div class="admin-topbar-actions">
      <!-- Search -->
      <div class="admin-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 5 5"/></svg>
        <input id="adminGlobalSearch" type="search" placeholder="Search..." autocomplete="off">
      </div>

      <!-- Notifications -->
      <button class="admin-icon-btn" type="button" aria-label="Notifications" data-admin-action="notifications">
        <svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
        <span class="admin-notification-dot">3</span>
      </button>

      <!-- Settings Dropdown -->
      <div class="admin-settings-wrapper">
        <button class="admin-icon-btn settings-trigger" id="adminSettingsBtn" type="button" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="m9.2 3.8.6-1.3h4.4l.6 1.3 1.5.9 1.4-.2 2.2 3.8-1 1.1v1.8l1 1.1-2.2 3.8-1.4-.2-1.5.9-.6 1.3H9.8l-.6-1.3-1.5-.9-1.4.2-2.2-3.8 1-1.1V9.2l-1-1.1 2.2-3.8 1.4.2 1.5-.9Z"/><circle cx="12" cy="10.1" r="2.8"/></svg>
        </button>

        <div class="admin-settings-dropdown" id="adminSettingsDropdown" hidden>
          <div class="admin-dropdown-heading">Settings</div>

          <!-- Theme -->
          <div class="admin-dropdown-group">
            <span class="admin-dropdown-label">Theme</span>
            <div class="admin-theme-options">
              <button type="button" class="admin-theme-btn" data-theme-choice="light">☀ Light</button>
              <button type="button" class="admin-theme-btn" data-theme-choice="dark">☾ Dark</button>
            </div>
          </div>

          <!-- Role -->
          <div class="admin-dropdown-group">
            <span class="admin-dropdown-label">View mode</span>
            <div class="admin-role-options">
              <button type="button" class="admin-role-btn" data-role="user">User</button>
              <button type="button" class="admin-role-btn" data-role="admin">Admin</button>
            </div>
          </div>

          <div class="admin-dropdown-divider"></div>
          
          <button type="button" class="admin-dropdown-link" data-admin-action="profile">My Profile</button>
          <button type="button" class="admin-dropdown-link danger" data-admin-action="logout">Logout</button>
        </div>
      </div>
    </div>
  </header>
</div>
