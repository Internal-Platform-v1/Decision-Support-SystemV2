<!-- ============================================================
     shared/header.html
     ============================================================ -->
<header class="topbar">
    <div class="brand-area">
        <img class="fedex-logo-image" src="assets/images/fedex-logo.png" alt="FedEx Freight">
        <div class="brand-divider"></div>

        <!-- inline navigation -->
        <nav class="brand-nav" aria-label="Main navigation">
            <button class="nav-item active" data-nav="home">
                <span class="nav-label">Home</span>
                <span class="nav-underline"></span>
            </button>

            <!-- Case Directory with dropdown wrapper -->
            <div class="nav-dropdown-wrapper">
                <button class="nav-item has-dropdown" id="caseDirectoryBtn">
                    <span class="nav-label">Case Directory</span>
                    <span class="dropdown-chevron">⌄</span>
                    <span class="nav-underline"></span>
                </button>

                <div class="dropdown-panel" id="caseDropdown">
                    <a href="legacy-case-directory.html" data-nav="legacy">
                        <span class="dropdown-icon">📂</span>
                        Legacy Case Directory
                    </a>

                    <a href="shine-case-directory.html" data-nav="shine">
                        <span class="dropdown-icon">✨</span>
                        Shine Case Directory
                    </a>
                </div>
            </div>

            <button class="nav-item" data-nav="ebs">
                <span class="nav-label">EBS Response</span>
                <span class="nav-underline"></span>
            </button>
            <button class="nav-item" data-nav="fbc">
                <span class="nav-label">FBC Comments</span>
                <span class="nav-underline"></span>
            </button>
            <button class="nav-item" data-nav="links">
                <span class="nav-label">Links</span>
                <span class="nav-underline"></span>
            </button>
        </nav>
    </div>

    <!-- right-hand actions -->
    <div class="header-actions">
        <div class="global-search">
            <span class="search-icon"></span>
            <input id="globalSearch" type="text" placeholder="Search guides, tools, topics..." autocomplete="off">
        </div>

        <button class="icon-btn notification-btn" aria-label="Notifications">
            <span class="bell-icon"></span>
            <b class="notification-dot">3</b>
        </button>

        <!-- Settings dropdown (replaces the old profile menu) -->
        <div class="settings-wrapper">
            <button
                class="icon-btn settings-btn"
                id="settingsBtn"
                type="button"
                aria-label="Open settings"
                aria-haspopup="true"
                aria-expanded="false"
            >
                <span class="settings-icon" aria-hidden="true">⚙</span>
            </button>

            <div class="settings-menu" id="settingsMenu" role="menu">
                <div class="settings-heading">Settings</div>

                <div class="settings-group">
                    <div class="settings-label" id="roleLabel">View mode</div>

                    <div class="role-options" role="radiogroup" aria-labelledby="roleLabel">
                        <button
                            type="button"
                            class="role-option"
                            data-role="user"
                            role="radio"
                            aria-checked="true"
                        >
                            User
                        </button>

                        <button
                            type="button"
                            class="role-option"
                            data-role="admin"
                            role="radio"
                            aria-checked="false"
                        >
                            Admin
                        </button>
                    </div>
                </div>

                <button
                    id="adminDashboardBtn"
                    type="button"
                    role="menuitem"
                    hidden
                >
                    <span aria-hidden="true">🛡️</span> Admin Dashboard
                </button>
            </div>
        </div>
    </div>
</header>
