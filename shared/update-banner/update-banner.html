<section class="dss-update-banner" id="dssUpdateBanner" aria-label="System updates">

  <div class="dss-update-banner__visual" aria-hidden="true">
<img
  src="/Decision-Support-SystemV2/assets/images/update-banner-truck.png"
  alt=""
  loading="eager"
>
  </div>

  <div class="dss-update-banner__copy">
    <div class="dss-update-banner__eyebrow">
      <span class="dss-update-banner__icon" aria-hidden="true">
        <i class="fa-solid fa-bullhorn"></i>
      </span>
      <span class="dss-update-banner__eyebrow-text">SYSTEM UPDATE</span>
    </div>

    <h2 class="dss-update-banner__title">EBS System Maintenance</h2>

    <p class="dss-update-banner__date">
      <i class="fa-regular fa-calendar"></i>
      <span class="dss-update-banner__date-text">May 25, 2025 from 1:00 AM – 5:00 AM PST.</span>
    </p>

    <p class="dss-update-banner__message">
      Some EBS features may be unavailable during this time.<br>
      Please plan your tasks accordingly.
    </p>

    <button
      class="dss-update-banner__button"
      type="button"
      data-update-action="view-all"
    >
      <span class="dss-update-banner__button-text">View All Updates</span>
      <span aria-hidden="true">→</span>
    </button>
  </div>

  <div class="dss-update-banner__dots" role="tablist" aria-label="Announcement categories">
    <button type="button" class="dss-update-banner__dot is-active" data-slide-to="0" aria-label="Announcements"></button>
    <button type="button" class="dss-update-banner__dot" data-slide-to="1" aria-label="What's New"></button>
    <button type="button" class="dss-update-banner__dot" data-slide-to="2" aria-label="Important Reminders"></button>
    <button type="button" class="dss-update-banner__dot" data-slide-to="3" aria-label="Known Issues"></button>
    <button type="button" class="dss-update-banner__dot" data-slide-to="4" aria-label="New Guides Added"></button>
  </div>

</section>
