<section class="dss-update-banner" id="dssUpdateBanner" aria-label="System updates" data-priority="normal">

  <!-- BACKGROUND IMAGE -->
  <div class="dss-update-banner__visual" aria-hidden="true">
    <img
      src="/Decision-Support-SystemV2/assets/images/update-banner-truck.png"
      alt=""
      loading="eager"
    >
  </div>

  <!-- GRADIENT OVERLAY -->
  <div class="dss-update-banner__overlay" aria-hidden="true"></div>

  <!-- CONTENT -->
  <div class="dss-update-banner__copy">
    
    <div class="dss-update-banner__top">
      <span class="dss-update-banner__icon" aria-hidden="true">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
      </span>
      
      <span class="dss-update-banner__eyebrow-text">NORMAL</span>
    </div>

    <h2 class="dss-update-banner__title">New Feature Release</h2>

    <p class="dss-update-banner__date">
      <span class="dss-update-banner__date-text"></span>
    </p>

    <p class="dss-update-banner__message">
      Explore the latest features and improvements designed to make your experience even better.
    </p>

    <button class="dss-update-banner__button" type="button" data-update-action="view-all">
      <span class="dss-update-banner__button-text">See What's New</span>
      <i class="fa-solid fa-arrow-right"></i>
    </button>

  </div>

  <div class="dss-update-banner__dots" role="tablist" aria-label="Announcement categories"></div>

</section>
