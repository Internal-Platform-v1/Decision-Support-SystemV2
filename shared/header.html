<!-- ============================================================
     shared/header.html – updated with new nav items in brand area
     ============================================================ -->
<header class="topbar">
    <div class="brand-area">
        <img class="fedex-logo-image" src="assets/images/fedex-logo.png" alt="FedEx Freight">
        <div class="brand-divider"></div>

        <!-- NEW: navigation moved right next to the logo -->
        <nav class="brand-nav" aria-label="Main navigation">
            <button class="nav-item active" data-nav="home">Home</button>

            <button class="nav-item has-dropdown" data-nav="cases" id="caseDirectoryBtn">
                Case Directory
                <span class="dropdown-chevron">⌄</span>
            </button>
            <!-- dropdown panel for Case Directory -->
            <div class="dropdown-panel" id="caseDropdown">
                <a href="#" data-nav="case1">Case Type A</a>
                <a href="#" data-nav="case2">Case Type B</a>
                <a href="#" data-nav="case3">Case Type C</a>
                <a href="#" data-nav="case4">Case Type D</a>
            </div>

            <button class="nav-item" data-nav="ebs">EBS Response</button>
            <button class="nav-item" data-nav="fbc">FBC Comments</button>
            <button class="nav-item" data-nav="links">Links</button>
        </nav>
    </div>

    <!-- right-hand actions (unchanged) -->
    <div class="header-actions">
        <div class="global-search">
            <input id="globalSearch" type="text" placeholder="Search guides, tools, topics..." autocomplete="off">
            <span class="search-icon"></span>
        </div>
        <button class="icon-btn notification-btn" aria-label="Notifications">
            <span class="bell-icon"></span><b class="notification-dot">3</b>
        </button>
        <button class="avatar-btn" id="profileBtn" aria-label="Open profile">JD</button>
        <button class="tiny-chevron" id="profileChevron" aria-label="Open profile menu">⌄</button>
        <div class="profile-menu" id="profileMenu">
            <div class="profile-name">Jennifer</div>
            <div class="profile-role">BD Tools User</div>
            <button>Profile</button>
            <button>Settings</button>
            <button>Logout</button>
        </div>
    </div>
</header>
