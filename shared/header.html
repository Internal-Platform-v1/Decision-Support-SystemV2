<header class="topbar">
    <div class="brand-area">
        <img class="fedex-logo-image" src="assets/images/fedex-logo.png" alt="FedEx Freight">
        <div class="brand-divider"></div>
        <div class="page-title">BD Tools — Main Menu</div>
    </div>

    <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-nav="home">Home</button>
        <button class="nav-item has-chevron" data-nav="guides">Guide Library</button>
        <button class="nav-item has-chevron" data-nav="cases">Case Directory</button>
        <button class="nav-item has-chevron" data-nav="tools">Tools</button>
        <button class="nav-item" data-nav="links">Links</button>
    </nav>

    <div class="header-actions">
        <div class="global-search">
            <input id="globalSearch" type="text" placeholder="Search guides, tools, topics..." autocomplete="off">
            <span class="search-icon"></span>
        </div>
        <button class="icon-btn notification-btn" aria-label="Notifications">
            <span class="bell-icon"></span><b class="notification-dot">3</b>
        </button>
        <button class="avatar-btn" id="profileBtn" aria-label="Open profile">JD</button>
        <button class="tiny-chevron" id="profileChevron" aria-label="Open profile menu">⌄</button>
        <div class="profile-menu" id="profileMenu">
            <div class="profile-name">Jennifer</div>
            <div class="profile-role">BD Tools User</div>
            <button>Profile</button>
            <button>Settings</button>
            <button>Logout</button>
        </div>
    </div>
</header>
