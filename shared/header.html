<!-- ============================================================
     shared/header.html – refined with animation hooks
     ============================================================ -->
<header class="topbar">
    <div class="brand-area">
        <img class="fedex-logo-image" src="assets/images/fedex-logo.png" alt="FedEx Freight">
        <div class="brand-divider"></div>

        <!-- inline navigation -->
        <nav class="brand-nav" aria-label="Main navigation">
            <button class="nav-item active" data-nav="home">
                <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3.5 10.8 8.5-7 8.5 7"></path><path d="M5.5 9.8V20h13V9.8"></path><path d="M9.5 20v-5.2h5V20"></path></svg></span><span class="nav-label">Home</span>
                <span class="nav-underline"></span>
            </button>

            <!-- Case Directory with dropdown wrapper -->
            <div class="nav-dropdown-wrapper">
                <button class="nav-item has-dropdown" id="caseDirectoryBtn">
                    <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 7.5h6l1.8 2h9.2v8.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"></path><path d="M3.5 7.5V6a2 2 0 0 1 2-2h4l1.7 2h5.3"></path></svg></span><span class="nav-label">Case Directory</span>
                    <span class="dropdown-chevron">⌄</span>
                    <span class="nav-underline"></span>
                </button>
                <div class="dropdown-panel" id="caseDropdown">
                    <a href="#" data-nav="legacy">
                        <span class="dropdown-icon icon-purple"><svg viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H10l2 2h5.5A2.5 2.5 0 0 1 20 8.5v9A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5z"></path><path d="M4 9h16"></path></svg></span>
                        Legacy Case Directory
                    </a>
                    <a href="#" data-nav="shine">
                        <span class="dropdown-icon icon-orange"><svg viewBox="0 0 24 24"><path d="m12 3 1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5z"></path><path d="m19 4 .5 1.5L21 6l-1.5.5L19 8l-.5-1.5L17 6l1.5-.5z"></path></svg></span>
                        Shine Case Directory
                    </a>
                </div>
            </div>

            <button class="nav-item" data-nav="ebs">
                <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3.8h8l4 4V20H6z"></path><path d="M14 3.8V8h4"></path><path d="M9 12h6M9 15.5h6"></path></svg></span><span class="nav-label">EBS Response</span>
                <span class="nav-underline"></span>
            </button>
            <button class="nav-item" data-nav="fbc">
                <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 5.5h14v10H9l-4 4z"></path><path d="M8.5 9h7M8.5 12h5"></path></svg></span><span class="nav-label">FBC Comments</span>
                <span class="nav-underline"></span>
            </button>
            <button class="nav-item" data-nav="links">
                <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10.5 13.5 13.5 10.5"></path><path d="M8.2 15.8 6.8 17.2a3.3 3.3 0 1 1-4.6-4.6l3.2-3.2a3.3 3.3 0 0 1 4.6 0"></path><path d="m15.8 8.2 1.4-1.4a3.3 3.3 0 1 1 4.6 4.6l-3.2 3.2a3.3 3.3 0 0 1-4.6 0"></path></svg></span><span class="nav-label">Links</span>
                <span class="nav-underline"></span>
            </button>
        </nav>
    </div>

    <!-- right-hand actions -->
    <div class="header-actions">
        <div class="global-search">
            <span class="search-icon"></span>
            <input id="globalSearch" type="text" placeholder="Search guides, tools, topics..." autocomplete="off">
        </div>
        <button class="icon-btn notification-btn" aria-label="Notifications">
            <span class="bell-icon"></span>
            <b class="notification-dot">3</b>
        </button>
        <button class="avatar-btn" id="profileBtn" aria-label="Open profile">JD</button>
        <button class="tiny-chevron" id="profileChevron" aria-label="Open profile menu">⌄</button>
        <div class="profile-menu" id="profileMenu">
            <div class="profile-name" id="profileName">User</div>
            <div class="profile-role">BD Tools User</div>
            <button><span class="profile-menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"></circle><path d="M5.5 20c.8-3.4 3-5.1 6.5-5.1s5.7 1.7 6.5 5.1"></path></svg></span> Profile</button>
            <button><span class="profile-menu-icon"><svg viewBox="0 0 24 24"><path d="M12 3.5 13.4 5l2.1-.2.9 1.8 2 .8-.2 2.1 1.5 1.5-1.5 1.5.2 2.1-2 .8-.9 1.8-2.1-.2L12 18.5l-1.4-1.5-2.1.2-.9-1.8-2-.8.2-2.1-1.5-1.5 1.5-1.5-.2-2.1 2-.8.9-1.8 2.1.2z"></path><circle cx="12" cy="11.5" r="2.6"></circle></svg></span> Settings</button>
            <button><span class="profile-menu-icon"><svg viewBox="0 0 24 24"><path d="M10 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20H10"></path><path d="m14 8 4 4-4 4M18 12H9"></path></svg></span> Logout</button>
        </div>
    </div>
</header>
