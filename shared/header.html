<header class="topbar">

  <div class="brand-area">
    <a
      href="https://internal-platform-v1.github.io/Decision-Support-System/index-main.html"
      aria-label="FedEx Freight Home"
    >
      <img
        class="fedex-logo-image"
        src="fedex-logo.png"
        alt="FedEx Freight"
      >
    </a>
  </div>

  <nav class="main-nav" aria-label="Main navigation">

    <a
      class="nav-item active"
      data-nav="home"
      href="https://internal-platform-v1.github.io/Decision-Support-System/index-main.html"
    >
      Home
    </a>

    <button
      class="nav-item has-chevron"
      data-nav="cases"
      id="caseDirectoryBtn"
      type="button"
      aria-haspopup="true"
      aria-expanded="false"
    >
      Case Directory
      <span class="nav-chevron">⌄</span>
    </button>

    <a
      class="nav-item"
      data-nav="ebs"
      href="https://internal-platform-v1.github.io/Decision-Support-System/ebs-response-template.html"
    >
      EBS Response
    </a>

    <a
      class="nav-item"
      data-nav="fbc"
      href="https://internal-platform-v1.github.io/Decision-Support-System/fbc-comments-guide.html"
    >
      FBC Comments
    </a>

    <a
      class="nav-item"
      data-nav="links"
      href="https://internal-platform-v1.github.io/Decision-Support-System/links.html"
    >
      Links
    </a>

  </nav>

  <div class="header-actions">

    <div class="global-search">
      <input
        id="globalSearch"
        type="text"
        placeholder="Search guides, tools, topics..."
        autocomplete="off"
      >
      <span class="search-icon"></span>
    </div>

    <button
      class="icon-btn notification-btn"
      aria-label="Notifications"
      type="button"
    >
      <span class="bell-icon"></span>
      <b class="notification-dot">3</b>
    </button>

    <button
      class="avatar-btn"
      id="profileBtn"
      aria-label="Open profile"
      type="button"
    >
      JD
    </button>

    <button
      class="tiny-chevron"
      id="profileChevron"
      aria-label="Open profile menu"
      type="button"
    >
      ⌄
    </button>

    <div class="profile-menu" id="profileMenu">

      <div class="profile-name">Jennifer</div>
      <div class="profile-role">BD Tools User</div>

      <button type="button">Profile</button>
      <button type="button">Settings</button>
      <button type="button">Logout</button>

    </div>

  </div>

</header>
