<header class="topbar" id="sharedHeader">
  <div class="brand-area">
    <a
      class="brand-link"
      href="https://internal-platform-v1.github.io/Decision-Support-System/index-main.html"
      aria-label="BD Tools Home"
    >
      <img
        class="fedex-logo-image"
        src="../../assets/images/fedex-logo.png"
        alt="FedEx Freight"
      >
    </a>
  </div>

  <nav class="main-nav" aria-label="Main navigation">

    <a
      class="nav-link"
      data-nav="home"
      data-section="home"
      href="https://internal-platform-v1.github.io/Decision-Support-System/index-main.html"
    >Home</a>

    <div class="nav-dropdown" data-section="cases">
      <button
        class="nav-link dropdown-trigger"
        type="button"
        data-nav="cases"
        aria-haspopup="true"
        aria-expanded="false"
      >
        Case Directory
        <span class="dropdown-chevron" aria-hidden="true">⌄</span>
      </button>

      <div class="nav-dropdown-menu" role="menu">
        <a
          href="#"
          role="menuitem"
          data-case-directory="legacy"
        >Legacy</a>

        <a
          href="#"
          role="menuitem"
          data-case-directory="shine"
        >Shine</a>
      </div>
    </div>

    <a
      class="nav-link"
      data-nav="ebs"
      data-section="tools"
      href="https://internal-platform-v1.github.io/Decision-Support-System/ebs-response-template.html"
    >EBS Response</a>

    <a
      class="nav-link"
      data-nav="fbc"
      data-section="tools"
      href="https://internal-platform-v1.github.io/Decision-Support-System/fbc-comments-guide.html"
    >FBC Comments</a>

    <a
      class="nav-link"
      data-nav="links"
      data-section="links"
      href="https://internal-platform-v1.github.io/Decision-Support-System/links.html"
    >Links</a>

  </nav>

  <div class="header-actions">
    <div class="global-search" role="search">
      <span class="search-icon" aria-hidden="true"></span>
      <input
        id="globalSearch"
        type="text"
        placeholder="Search guides, tools, topics..."
        autocomplete="off"
        aria-label="Search guides, tools, and topics"
      >
    </div>

    <button
      class="icon-btn notification-btn"
      id="notificationBtn"
      type="button"
      aria-label="Notifications"
    >
      <span class="bell-icon" aria-hidden="true"></span>
      <b class="notification-dot">3</b>
    </button>

    <button
      class="avatar-btn"
      id="profileBtn"
      type="button"
      aria-label="Open profile menu"
      aria-expanded="false"
    >JD</button>

    <button
      class="tiny-chevron"
      id="profileChevron"
      type="button"
      aria-label="Open profile menu"
      aria-expanded="false"
    >⌄</button>

    <div
      class="profile-menu"
      id="profileMenu"
      aria-hidden="true"
    >
      <div class="profile-name" id="profileName">Jennifer</div>
      <div class="profile-role" id="profileRole">BD Tools User</div>

      <div class="profile-menu-divider"></div>

      <button type="button" data-profile-action="profile">
        <span class="profile-menu-icon">○</span>
        Profile
      </button>

      <button type="button" data-profile-action="settings">
        <span class="profile-menu-icon">⚙</span>
        Settings
      </button>

      <div class="profile-menu-divider"></div>

      <button class="logout-action" type="button" data-profile-action="logout">
        <span class="profile-menu-icon">↪</span>
        Logout
      </button>
    </div>
  </div>
</header>
