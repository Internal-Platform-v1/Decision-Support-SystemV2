<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Announcements | Decision Support System</title>
  <link rel="icon" href="data:,">

  <link rel="stylesheet" href="../../shared/header/admin-header.css" />
  <link rel="stylesheet" href="admin-announcements.css" />
</head>

<body data-admin-page="announcements" data-admin-title="Announcements">

  <div id="adminHeader"></div>

  <main class="at-main">

    <!-- TOP BAR: category filter + Add New -->
    <section class="at-toolbar">
      <div class="at-toolbar-group">
        <label for="atCategoryFilter">Filter</label>
        <select id="atCategoryFilter" aria-label="Filter by category">
          <option value="">All Categories</option>
          <option value="general">📢 Announcements</option>
          <option value="whats_new">✨ What's New?</option>
          <option value="reminders">⚠ Important Reminders</option>
          <option value="issues">🐞 Known Issues</option>
          <option value="guides">📚 New Guides Added</option>
        </select>
      </div>

      <div class="at-toolbar-actions">
        <button type="button" class="at-btn primary" id="atAddNew">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="at-btn-icon"><path d="M12 5v14M5 12h14"/></svg>
          New Announcement
        </button>
      </div>
    </section>

    <!-- WORKSPACE -->
    <section class="at-workspace">

      <!-- LEFT: LIST OF POSTS -->
      <aside class="at-panel at-left-panel" aria-label="Announcements">
        <header class="at-panel-head">
          <div>
            <span>POSTED ANNOUNCEMENTS</span>
            <h2 id="atLeftTitle">Loading…</h2>
          </div>
          <span class="at-count" id="atPostCount">—</span>
        </header>

        <div class="at-rec-list" id="atPostList">
          <p class="at-empty">Loading announcements…</p>
        </div>
      </aside>

      <!-- RIGHT: EDITOR -->
      <section class="at-panel at-editor" aria-label="Editor">
        <header class="at-panel-head">
          <div>
            <span id="atEditorEyebrow">ANNOUNCEMENT DETAILS</span>
            <h2 id="atEditorTitle">No announcement selected</h2>
            <p id="atEditorSubtitle" class="at-editor-subtitle">
              Select an announcement on the left, or create a new one.
            </p>
          </div>
          <div class="at-editor-head-actions">
            <button type="button" class="at-btn ghost" id="atDelete" hidden>Delete</button>
          </div>
        </header>

        <div class="at-editor-body" id="atEditorBody" hidden>
          <div class="at-edit-field">
            <label for="atCategory">
              <span>Category</span>
              <small>Where this announcement appears in the banner.</small>
            </label>
            <select id="atCategory">
              <option value="general">📢 Announcements</option>
              <option value="whats_new">✨ What's New?</option>
              <option value="reminders">⚠ Important Reminders</option>
              <option value="issues">🐞 Known Issues</option>
              <option value="guides">📚 New Guides Added</option>
            </select>
          </div>

          <div class="at-edit-field">
            <label for="atEyebrow">
              <span>Eyebrow Text</span>
              <small>Small text above the title.</small>
            </label>
            <input id="atEyebrow" type="text" placeholder="SYSTEM UPDATE">
          </div>

          <div class="at-edit-field">
            <label for="atTitle">
              <span>Title</span>
              <small>Main heading of the announcement.</small>
            </label>
            <input id="atTitle" type="text" placeholder="EBS System Maintenance">
          </div>

          <div class="at-edit-field">
            <label for="atDate">
              <span>Date / Time</span>
              <small>When the update or event happens.</small>
            </label>
            <input id="atDate" type="text" placeholder="May 25, 2025 from 1:00 AM – 5:00 AM PST.">
          </div>

          <div class="at-edit-field">
            <label for="atMessage">
              <span>Message Body</span>
              <small>Supporting text. Use line breaks for multiple lines.</small>
            </label>
            <textarea id="atMessage" rows="4" placeholder="Some features may be unavailable."></textarea>
          </div>

          <div class="at-edit-field">
            <label for="atButton">
              <span>Button Text</span>
              <small>Label for the button in the banner.</small>
            </label>
            <input id="atButton" type="text" placeholder="View All Updates">
          </div>

          <div class="at-editor-footer">
            <span class="at-doc-ids" id="atDocIds"></span>
            <div class="at-editor-actions">
              <button type="button" class="at-btn ghost" id="atReset">Reset</button>
              <button type="button" class="at-btn primary" id="atSave">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="at-btn-icon"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>
                Save
              </button>
            </div>
          </div>
        </div>

        <div class="at-editor-placeholder" id="atEditorPlaceholder">
          <div class="at-editor-placeholder-icon">✎</div>
          <p>No announcement selected.</p>
          <small>Choose one from the left, or click "New Announcement".</small>
        </div>
      </section>

    </section>

  </main>

  <div class="at-toast" id="atToast" role="status" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDjaMdeh0Cgx00hzDyZOi54fDkR81wnxJU",
      authDomain: "bdgg-database.firebaseapp.com",
      projectId: "bdgg-database",
      storageBucket: "bdgg-database.appspot.com",
      messagingSenderId: "43574975434",
      appId: "1:43574975434:web:4c79e581267fdfcc6ccd33"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    window.db = firebase.firestore();
    window.auth = firebase.auth();
  </script>

  <script src="../../shared/header/admin-header.js"></script>
  <script src="admin-announcements.js"></script>
</body>
</html>
