<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Templates Management | Decision Support System</title>
  <link rel="icon" href="data:,">

  <!-- Main App Styles -->
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  
  <!-- Templates Page Styles -->
  <link rel="stylesheet" href="admin-templates.css" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

  <!-- Hidden Shared Admin Header (for auth & guard) -->
  <div id="adminHeader"></div>

  <!-- Main Application Shell -->
  <div class="app-shell">
    
    <!-- Page Header -->
    <header class="page-header">
      <div class="page-title">
        <i class="fa-solid fa-file-lines"></i>
        <h1>Templates Management</h1>
      </div>
      <a href="../admin-dashboard/admin-dashboard.html" class="btn btn-outline" style="text-decoration: none;">
        <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
      </a>
    </header>

    <!-- Control Panel (Category & Guide) -->
    <section class="control-panel">
      <div class="form-group">
        <label for="atCategorySelect">Category</label>
        <select id="atCategorySelect" class="form-select">
          <option value="">All categories</option>
        </select>
      </div>

      <div class="form-group">
        <label for="atGuideSelect">Guide</label>
        <select id="atGuideSelect" class="form-select" disabled>
          <option value="">Select a category first…</option>
        </select>
      </div>

      <div class="view-toggle">
        <button type="button" class="view-btn" data-view="list">
          <i class="fa-solid fa-list"></i> List
        </button>
        <button type="button" class="view-btn" data-view="chart">
          <i class="fa-solid fa-project-diagram"></i> Chart
        </button>
      </div>
    </section>

    <!-- Two Column Workspace -->
    <main class="workspace">
      
      <!-- Left: Recommendations / Flow Chart -->
      <div class="template-panel">
        <header class="panel-header">
          <h2 id="atLeftTitle">Final Recommendations</h2>
          <span id="atRecommendationCount">0 found</span>
        </header>

        <!-- List View -->
        <div class="list-container active" id="atRecommendationList">
          <div class="empty-state">
            <i class="fa-solid fa-list-ul"></i>
            <p>Select a guide to load its recommendations.</p>
          </div>
        </div>

        <!-- Chart View -->
        <div class="chart-container" id="atChartHost">
          <div class="chart-toolbar">
            <button type="button" class="chart-btn" id="atZoomOut">−</button>
            <button type="button" class="chart-btn" id="atZoomIn">+</button>
            <button type="button" class="chart-btn" id="atZoomReset">Reset</button>
            <button type="button" class="chart-btn" id="atExpandAll">Expand All</button>
            <button type="button" class="chart-btn" id="atCollapseAll">Collapse All</button>
          </div>
          <svg class="chart-svg" id="atChartSvg"></svg>
        </div>
      </div>

      <!-- Right: Template Editor -->
      <div class="template-panel">
        <header class="panel-header">
          <h2 id="atEditorTitle">No recommendation selected</h2>
        </header>

        <div class="editor-body" id="atEditorBody" hidden>
          <div class="field-group">
            <label>Suggested Comment</label>
            <textarea id="atComment" rows="4" placeholder="Internal case notes..."></textarea>
          </div>

          <div class="field-group">
            <label>Suggested CORR Code</label>
            <textarea id="atCorr" rows="3" placeholder="Corrective code..."></textarea>
          </div>

          <div class="field-group">
            <label>Suggested Email</label>
            <textarea id="atEmail" rows="5" placeholder="Customer email..."></textarea>
          </div>

          <div class="editor-footer">
            <div class="doc-ids" id="atDocIds"></div>
            <div class="editor-actions">
              <button type="button" class="btn btn-outline" id="atReset" disabled>Reset</button>
              <button type="button" class="btn btn-primary" id="atSave" disabled>Save Templates</button>
            </div>
          </div>
        </div>

        <!-- Placeholder -->
        <div class="empty-state" id="atEditorPlaceholder">
          <i class="fa-solid fa-pen-to-square"></i>
          <p>Choose a final recommendation on the left to start editing.</p>
        </div>
      </div>

    </main>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="atToast"></div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDjaMdeh0Cgx00hzDyZOi54fDkR81wnxJU",
      authDomain: "bdgg-database.firebaseapp.com",

      storageBucket: "bdgg-database.appspot.com",
      messagingSenderId: "43574975434",

    window.db = firebase.firestore();
    window.auth = firebase.auth();
  </script>

  <script src="../../shared/header/admin-header.js"></script>
  <script src="../../assets/js/guide-flows/manifest.js"></script>
  <script src="admin-templates.js"></script>
</body>
</html>
